<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frases de La Vida</title>
  <link rel="icon" href="data:,">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg-main: linear-gradient(135deg, #dbeafe, #eff6ff, #ffffff);
      --card-bg: white;
      --text-main: #222;
      --text-soft: #666;
      --header-bg: rgba(255,255,255,0.9);
      --shadow: rgba(0,0,0,0.12);
      --button-bg: #222;
      --button-text: white;
    }

    body.dark{
      --bg-main:
        radial-gradient(circle at top, rgba(59,130,246,0.28), transparent 35%),
        linear-gradient(135deg, #020617, #0f172a, #1e3a8a);
      --card-bg: rgba(255,255,255,0.08);
      --text-main: #f8fafc;
      --text-soft: #cbd5e1;
      --header-bg: rgba(2,6,23,0.85);
      --shadow: rgba(0,0,0,0.35);
      --button-bg: #67e8f9;
      --button-text: #020617;
    }

    body{
      background: var(--bg-main);
      font-family: Arial, sans-serif;
      color: var(--text-main);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      transition:0.4s;
    }

    header{
      width:100%;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:var(--header-bg);
      box-shadow:0 2px 10px var(--shadow);
      flex-wrap:wrap;
      gap:10px;
      backdrop-filter: blur(14px);
    }

    .email{
      font-size:14px;
      color:var(--text-soft);
    }

    .socials{
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .socials a{
      text-decoration:none;
      color:var(--text-main);
      font-weight:bold;
      transition:0.3s;
    }

    .socials a:hover{
      opacity:0.7;
    }

    .admin-btn,
    .theme-btn{
      padding:10px 18px;
      border:none;
      border-radius:10px;
      background:var(--button-bg);
      color:var(--button-text);
      cursor:pointer;
      font-weight:bold;
    }

    main{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:30px;
    }

    .frase-box{
      background:var(--card-bg);
      padding:50px 30px;
      border-radius:24px;
      max-width:760px;
      width:100%;
      box-shadow:0 12px 35px var(--shadow);
      backdrop-filter: blur(18px);
      border:1px solid rgba(255,255,255,0.18);
    }

    h1{
      font-size:40px;
      margin-bottom:30px;
      color:var(--text-main);
    }

    #frase{
      font-size:26px;
      line-height:1.6;
      margin-bottom:25px;
      color:var(--text-main);
      white-space:pre-line;
    }

    .fecha{
      color:var(--text-soft);
      margin-bottom:20px;
      font-size:15px;
    }

    .firma{
      font-size:20px;
      font-style:italic;
      color:var(--text-soft);
    }

    button{
      margin-top:30px;
      padding:12px 25px;
      border:none;
      border-radius:10px;
      background:var(--button-bg);
      color:var(--button-text);
      cursor:pointer;
      font-size:16px;
      transition:0.3s;
      font-weight:bold;
    }

    button:hover{
      transform:translateY(-2px);
      opacity:0.9;
    }

    footer{
      text-align:center;
      padding:20px;
      background:var(--header-bg);
      font-size:14px;
      color:var(--text-soft);
      box-shadow:0 -2px 10px var(--shadow);
      backdrop-filter: blur(14px);
    }

    .panel-admin{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.75);
      display:none;
      justify-content:center;
      align-items:center;
      z-index:9999;
      padding:20px;
      overflow-y:auto;
    }

    .admin-box{
      background:white;
      color:#222;
      width:100%;
      max-width:620px;
      padding:30px;
      border-radius:20px;
      text-align:center;
      max-height:90vh;
      overflow-y:auto;
    }

    .admin-box input,
    .admin-box textarea{
      width:100%;
      padding:14px;
      margin-bottom:15px;
      border-radius:12px;
      border:1px solid #ddd;
      font-size:16px;
    }

    .admin-box textarea{
      resize:none;
      min-height:140px;
    }

    .admin-box button{
      width:100%;
      margin-top:10px;
      background:#222;
      color:white;
    }

    .lista-frases{
      margin-top:25px;
      text-align:left;
    }

    .frase-item{
      background:#f3f4f6;
      border:1px solid #ddd;
      border-radius:14px;
      padding:15px;
      margin-bottom:12px;
    }

    .frase-item p{
      white-space:pre-line;
      margin-bottom:8px;
      color:#222;
      line-height:1.5;
    }

    .frase-item small{
      color:#666;
    }

    .acciones-frase{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .acciones-frase button{
      margin-top:0;
      padding:10px;
      font-size:14px;
    }

    .editar{
      background:#2563eb !important;
    }

    .eliminar{
      background:#dc2626 !important;
    }

    @media(max-width:768px){
      header{
        flex-direction:column;
      }

      h1{
        font-size:30px;
      }

      #frase{
        font-size:22px;
      }

      .frase-box{
        padding:45px 22px;
      }

      .acciones-frase{
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="email">abaezjorge@gmail.com</div>

  <div class="socials">
    <a href="#">Instagram</a>
    <a href="#">Facebook</a>
    <a href="#">TikTok</a>

    <button class="theme-btn" onclick="cambiarModo()" id="modoBtn">🌙 Oscuro</button>
    <button class="admin-btn" onclick="abrirAdmin()">Administración</button>
  </div>
</header>

<main>
  <div class="frase-box">
    <h1>Frases de La Vida</h1>

    <div id="frase"></div>

    <div class="fecha" id="fechaPublicacion"></div>

    <div class="firma">— By Andy</div>

    <button onclick="nuevaFrase()">Nueva Frase</button>
  </div>
</main>

<footer>
  © 2026 Reservado por derechos de autor • By Andy
</footer>

<div class="panel-admin" id="panelAdmin">
  <div class="admin-box">
    <h2>🔐 Panel Administración</h2>

    <div id="loginArea">
      <input type="password" id="claveAdmin" placeholder="Ingresa la clave">
      <button onclick="verificarClave()">Entrar</button>
    </div>

    <div id="editorArea" style="display:none;">
      <textarea id="nuevaFraseTexto" placeholder="Escribe tu nueva frase..."></textarea>

      <button onclick="publicarFrase()" id="btnPublicar">Publicar Frase</button>

      <button onclick="cancelarEdicion()" id="btnCancelar" style="display:none;background:#6b7280;">
        Cancelar Edición
      </button>

      <button onclick="restaurarFrasesIniciales()" style="background:#0f766e;">
        Restaurar Frases Iniciales
      </button>

      <div class="lista-frases">
        <h3>📚 Frases Publicadas</h3>
        <div id="listaFrases"></div>
      </div>
    </div>

    <button onclick="cerrarAdmin()">Cerrar</button>
  </div>
</div>

<script>
const frasesIniciales = [
  {
    texto:"A veces, los mejores compañeros de chess estuvieron cerca de nosotros… y nunca lo vimos.\n\nhasta que la partida inició ~",
    fecha:"Publicado por By Andy"
  },
  {
    texto:"Yo tampoco creería.",
    fecha:"Publicado por By Andy"
  },
  {
    texto:"El problema es que funciona.",
    fecha:"Publicado por By Andy"
  },
  {
    texto:"Recuerda que antes de un proyecto, el NO ya lo tienes.\n\nEl que no tienes todavía es el SÍ.",
    fecha:"Publicado por By Andy"
  },
  {
    texto:"La luz cambia la percepción que tenemos de la vida y de los desafíos que nos presenta.",
    fecha:"Publicado por By Andy"
  },
  {
    texto:"Nunca es tarde para hacer lo que deberías haber sido.",
    fecha:"Publicado por By Andy"
  },
  {
    texto:"A veces el silencio no es vacío.\n\nEs una estrategia de la mente para volver más fuerte.",
    fecha:"Publicado por By Andy"
  },
  {
    texto:"No todo el mundo va a entender tu proceso.\n\nPero eso no significa que tu proceso esté mal.",
    fecha:"Publicado por By Andy"
  },
  {
    texto:"Sigue, actúa e impleméntalo.\n\nLa idea que no ejecutas se queda viviendo solo en tu mente.",
    fecha:"Publicado por By Andy"
  },
  {
    texto:"Cuando la partida inició, entendí que algunas piezas siempre estuvieron cerca.",
    fecha:"Publicado por By Andy"
  }
];

let frases = cargarFrases();
let indiceEditando = null;
let ultimoIndice = 0;

function cargarFrases(){
  try{
    const data = JSON.parse(localStorage.getItem("frasesByAndy"));

    if(Array.isArray(data) && data.length > 0){
      const frasesValidas = data.filter(item => item && typeof item.texto === "string");

      if(frasesValidas.length > 0){
        return frasesValidas;
      }
    }

    guardarFrasesIniciales();
    return frasesIniciales.slice();
  }catch(error){
    localStorage.removeItem("frasesByAndy");
    guardarFrasesIniciales();
    return frasesIniciales.slice();
  }
}

function guardarFrasesIniciales(){
  localStorage.setItem("frasesByAndy", JSON.stringify(frasesIniciales));
}

function guardarFrases(){
  localStorage.setItem("frasesByAndy", JSON.stringify(frases));
}

function mostrarFrase(fraseObj){
  if(!fraseObj || typeof fraseObj.texto !== "string"){
    document.getElementById("frase").innerText = "Todavía no hay frases publicadas.";
    document.getElementById("fechaPublicacion").innerText = "Publica tu primera frase desde Administración.";
    return;
  }

  document.getElementById("frase").innerText = "“" + fraseObj.texto + "”";
  document.getElementById("fechaPublicacion").innerText = fraseObj.fecha || "Publicado por By Andy";
}

function nuevaFrase(){
  if(frases.length === 0){
    mostrarFrase(null);
    return;
  }

  ultimoIndice++;

  if(ultimoIndice >= frases.length){
    ultimoIndice = 0;
  }

  mostrarFrase(frases[ultimoIndice]);
}

function abrirAdmin(){
  document.getElementById("panelAdmin").style.display = "flex";
  renderizarListaFrases();
}

function cerrarAdmin(){
  document.getElementById("panelAdmin").style.display = "none";
}

function verificarClave(){
  const clave = document.getElementById("claveAdmin").value;

  if(clave === "3321"){
    document.getElementById("loginArea").style.display = "none";
    document.getElementById("editorArea").style.display = "block";
    renderizarListaFrases();
  }else{
    alert("❌ Clave incorrecta");
  }
}

function publicarFrase(){
  const texto = document.getElementById("nuevaFraseTexto").value.trim();

  if(texto === ""){
    alert("Escribe una frase.");
    return;
  }

  const ahora = new Date();
  const fecha = ahora.toLocaleDateString("es-DO");
  const hora = ahora.toLocaleTimeString("es-DO");

  if(indiceEditando !== null){
    frases[indiceEditando].texto = texto;
    frases[indiceEditando].fecha = "Editado el " + fecha + " a las " + hora;

    mostrarFrase(frases[indiceEditando]);

    indiceEditando = null;
    document.getElementById("btnPublicar").innerText = "Publicar Frase";
    document.getElementById("btnCancelar").style.display = "none";

    alert("✅ Frase editada correctamente");
  }else{
    const nueva = {
      texto:texto,
      fecha:"Publicado el " + fecha + " a las " + hora
    };

    frases.unshift(nueva);
    mostrarFrase(nueva);
    ultimoIndice = 0;

    alert("✅ Frase publicada correctamente");
  }

  guardarFrases();
  document.getElementById("nuevaFraseTexto").value = "";
  renderizarListaFrases();
}

function editarFrase(index){
  indiceEditando = index;

  document.getElementById("nuevaFraseTexto").value = frases[index].texto;
  document.getElementById("btnPublicar").innerText = "Guardar Cambios";
  document.getElementById("btnCancelar").style.display = "block";
  document.getElementById("nuevaFraseTexto").focus();
}

function cancelarEdicion(){
  indiceEditando = null;

  document.getElementById("nuevaFraseTexto").value = "";
  document.getElementById("btnPublicar").innerText = "Publicar Frase";
  document.getElementById("btnCancelar").style.display = "none";
}

function eliminarFrase(index){
  const confirmar = confirm("¿Seguro que quieres eliminar esta frase?");

  if(!confirmar){
    return;
  }

  frases.splice(index, 1);
  guardarFrases();
  renderizarListaFrases();

  if(frases.length > 0){
    ultimoIndice = 0;
    mostrarFrase(frases[0]);
  }else{
    mostrarFrase(null);
  }

  alert("🗑️ Frase eliminada correctamente");
}

function restaurarFrasesIniciales(){
  const confirmar = confirm("Esto restaurará las frases iniciales. Las frases publicadas desde este navegador se reemplazarán. ¿Deseas continuar?");

  if(!confirmar){
    return;
  }

  frases = frasesIniciales.slice();
  ultimoIndice = 0;
  indiceEditando = null;

  guardarFrases();
  mostrarFrase(frases[0]);
  renderizarListaFrases();

  document.getElementById("nuevaFraseTexto").value = "";
  document.getElementById("btnPublicar").innerText = "Publicar Frase";
  document.getElementById("btnCancelar").style.display = "none";

  alert("✅ Frases iniciales restauradas");
}

function renderizarListaFrases(){
  const contenedor = document.getElementById("listaFrases");

  if(!contenedor){
    return;
  }

  contenedor.innerHTML = "";

  if(frases.length === 0){
    contenedor.innerHTML = "<p>No hay frases publicadas todavía.</p>";
    return;
  }

  frases.forEach((frase, index) => {
    const item = document.createElement("div");
    item.className = "frase-item";

    const texto = document.createElement("p");
    texto.innerText = "“" + frase.texto + "”";

    const fecha = document.createElement("small");
    fecha.innerText = frase.fecha || "Publicado por By Andy";

    const acciones = document.createElement("div");
    acciones.className = "acciones-frase";

    const btnEditar = document.createElement("button");
    btnEditar.className = "editar";
    btnEditar.innerText = "Editar";
    btnEditar.onclick = function(){
      editarFrase(index);
    };

    const btnEliminar = document.createElement("button");
    btnEliminar.className = "eliminar";
    btnEliminar.innerText = "Eliminar";
    btnEliminar.onclick = function(){
      eliminarFrase(index);
    };

    acciones.appendChild(btnEditar);
    acciones.appendChild(btnEliminar);

    item.appendChild(texto);
    item.appendChild(fecha);
    item.appendChild(acciones);

    contenedor.appendChild(item);
  });
}

function cambiarModo(){
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    localStorage.setItem("modoFrases", "oscuro");
    document.getElementById("modoBtn").innerText = "☀️ Claro";
  }else{
    localStorage.setItem("modoFrases", "claro");
    document.getElementById("modoBtn").innerText = "🌙 Oscuro";
  }
}

window.onload = function(){
  const modoGuardado = localStorage.getItem("modoFrases");

  if(modoGuardado === "oscuro"){
    document.body.classList.add("dark");
    document.getElementById("modoBtn").innerText = "☀️ Claro";
  }

  if(frases.length > 0){
    mostrarFrase(frases[0]);
  }else{
    mostrarFrase(null);
  }
};
</script>

</body>
</html>
