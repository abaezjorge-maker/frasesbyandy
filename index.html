<header>

  <div class="email">
    abaezjorge@gmail.com
  </div>

  <div class="socials">

    <a href="#">Instagram</a>
    <a href="#">Facebook</a>

    <button class="admin-btn" onclick="abrirAdmin()">
      Administración
    </button>

  </div>

</header>

<main>

  <div class="frase-box">

    <h1>Frases de La Vida</h1>

    <div id="frase">
      “La luz cambia la percepción que tenemos de la vida.”
    </div>

    <div class="fecha" id="fechaPublicacion">
      Publicado: Hoy
    </div>

    <div class="firma">
      — By Andy
    </div>

    <button onclick="nuevaFrase()">
      Nueva Frase
    </button>

  </div>

</main>

<footer>
  © 2026 Reservado por derechos de autor • By Andy
</footer>

<!-- PANEL ADMIN -->

<div class="panel-admin" id="panelAdmin">

  <div class="admin-box">

    <h2>🔐 Panel Administración</h2>

    <div id="loginArea">

      <input type="password" id="claveAdmin" placeholder="Ingresa la clave">

      <button onclick="verificarClave()">
        Entrar
      </button>

    </div>

    <div id="editorArea" style="display:none;">

      <textarea id="nuevaFraseTexto" placeholder="Escribe tu nueva frase..."></textarea>

      <button onclick="publicarFrase()">
        Publicar Frase
      </button>

    </div>

    <button onclick="cerrarAdmin()">
      Cerrar
    </button>

  </div>

</div>

<script>

const frases = [

  {
    texto:"La luz cambia la percepción que tenemos de la vida.",
    fecha:"Publicado inicialmente"
  },

  {
    texto:"Nunca es tarde para hacer lo que deberías haber hecho.",
    fecha:"Publicado inicialmente"
  },

  {
    texto:"Las ideas más grandes nacen en momentos inesperados.",
    fecha:"Publicado inicialmente"
  }

];

function mostrarFrase(fraseObj){

  document.getElementById("frase").innerText =
  "“" + fraseObj.texto + "”";

  document.getElementById("fechaPublicacion").innerText =
  fraseObj.fecha;

}

function nuevaFrase(){

  let random = Math.floor(Math.random() * frases.length);

  mostrarFrase(frases[random]);

}

function abrirAdmin(){

  document.getElementById("panelAdmin").style.display = "flex";

}

function cerrarAdmin(){

  document.getElementById("panelAdmin").style.display = "none";

}

function verificarClave(){

  const clave = document.getElementById("claveAdmin").value;

  if(clave === "3321"){

    document.getElementById("loginArea").style.display = "none";

    document.getElementById("editorArea").style.display = "block";

  }else{

    alert("❌ Clave incorrecta");

  }

}

function publicarFrase(){

  const texto = document.getElementById("nuevaFraseTexto").value;

  if(texto.trim() === ""){

    alert("Escribe una frase.");

    return;

  }

  const ahora = new Date();

  const fecha = ahora.toLocaleDateString();

  const hora = ahora.toLocaleTimeString();

  const nueva = {

    texto:texto,

    fecha:"Publicado el " + fecha + " a las " + hora

  };

  frases.unshift(nueva);

  mostrarFrase(nueva);

  localStorage.setItem("ultimaFrase", JSON.stringify(nueva));

  document.getElementById("nuevaFraseTexto").value = "";

  alert("✅ Frase publicada correctamente");

}

window.onload = function(){

  const guardada = localStorage.getItem("ultimaFrase");

  if(guardada){

    mostrarFrase(JSON.parse(guardada));

  }

}

</script>

</body>
</html>
