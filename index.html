<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poesías by Andy</title>
  <link rel="icon" href="data:,">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg: #f3f0ea;
      --bg-soft: rgba(255,255,255,0.74);
      --card: rgba(255,255,255,0.88);
      --text: #1f2933;
      --muted: #6b7280;
      --border: rgba(31,41,55,0.12);
      --shadow: rgba(17,24,39,0.15);
      --accent: #111827;
      --accent-text: #ffffff;
      --danger: #dc2626;
      --edit: #2563eb;
    }

    body.dark{
      --bg: #050816;
      --bg-soft: rgba(15,23,42,0.74);
      --card: rgba(15,23,42,0.86);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --border: rgba(255,255,255,0.12);
      --shadow: rgba(0,0,0,0.45);
      --accent: #f8fafc;
      --accent-text: #020617;
      --danger: #ef4444;
      --edit: #60a5fa;
    }

    body{
      min-height:100vh;
      font-family: Georgia, 'Times New Roman', serif;
      background:
        linear-gradient(rgba(243,240,234,0.78), rgba(243,240,234,0.94)),
        url("https://images.unsplash.com/photo-1455390582262-044cdead277a/?auto=format&fit=crop&w=1800&q=80");
      background-size:cover;
      background-position:center;
      background-attachment:fixed;
      color:var(--text);
      transition:0.35s ease;
    }

    body.dark{
      background:
        radial-gradient(circle at top left, rgba(99,102,241,0.22), transparent 34%),
        radial-gradient(circle at bottom right, rgba(14,165,233,0.17), transparent 28%),
        linear-gradient(135deg, #020617, #111827, #1e1b4b);
    }

    header{
      position:sticky;
      top:0;
      z-index:50;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      padding:18px 7%;
      background:var(--bg-soft);
      border-bottom:1px solid var(--border);
      backdrop-filter: blur(16px);
      box-shadow:0 8px 28px var(--shadow);
    }

    .brand h1{
      font-size:30px;
      letter-spacing:0.5px;
      line-height:1.1;
    }

    .brand p{
      color:var(--muted);
      font-size:14px;
      margin-top:5px;
      font-family: Arial, sans-serif;
    }

    .header-actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    button{
      border:none;
      background:var(--accent);
      color:var(--accent-text);
      padding:11px 17px;
      border-radius:999px;
      font-weight:bold;
      cursor:pointer;
      transition:0.25s ease;
      font-family: Arial, sans-serif;
      box-shadow:0 8px 18px rgba(0,0,0,0.12);
    }

    button:hover{
      transform:translateY(-2px);
      opacity:0.92;
    }

    main{
      width:min(980px, 92%);
      margin:0 auto;
      padding:34px 0 45px;
    }

    .composer{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:0 18px 45px var(--shadow);
      padding:18px;
      backdrop-filter: blur(18px);
      margin-bottom:24px;
    }

    .composer-top{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
      font-family: Arial, sans-serif;
      color:var(--muted);
      font-weight:bold;
    }

    .avatar{
      width:42px;
      height:42px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--accent);
      color:var(--accent-text);
      font-family: Arial, sans-serif;
      font-weight:900;
    }

    .composer input,
    .composer textarea,
    .admin-card input,
    .admin-card textarea{
      width:100%;
      border:1px solid var(--border);
      outline:none;
      border-radius:18px;
      padding:14px 16px;
      background:rgba(255,255,255,0.62);
      color:#111827;
      font-size:16px;
      margin-bottom:12px;
      font-family: Arial, sans-serif;
    }

    body.dark .composer input,
    body.dark .composer textarea,
    body.dark .admin-card input,
    body.dark .admin-card textarea{
      background:rgba(255,255,255,0.08);
      color:#f8fafc;
    }

    .composer textarea{
      min-height:130px;
      resize:vertical;
      line-height:1.55;
    }

    .composer-actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .hint{
      color:var(--muted);
      font-family: Arial, sans-serif;
      font-size:13px;
    }

    .feed{
      display:flex;
      flex-direction:column;
      gap:20px;
    }

    .poem-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:26px;
      box-shadow:0 18px 45px var(--shadow);
      padding:28px;
      backdrop-filter: blur(18px);
      animation: entrada 0.35s ease both;
    }

    @keyframes entrada{
      from{opacity:0; transform:translateY(12px);}
      to{opacity:1; transform:translateY(0);}
    }

    .poem-title{
      font-size:23px;
      margin-bottom:16px;
      font-weight:bold;
    }

    .poem-text{
      white-space:pre-line;
      font-size:22px;
      line-height:1.72;
      color:var(--text);
    }

    .poem-date{
      margin-top:18px;
      padding-top:14px;
      border-top:1px solid var(--border);
      color:var(--muted);
      font-family: Arial, sans-serif;
      font-size:13px;
    }

    .post-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:16px;
    }

    .secondary{
      background:transparent;
      color:var(--text);
      border:1px solid var(--border);
      box-shadow:none;
    }

    .edit-btn{ background:var(--edit); color:white; }
    .delete-btn{ background:var(--danger); color:white; }

    .admin-panel{
      position:fixed;
      inset:0;
      z-index:9999;
      display:none;
      justify-content:center;
      align-items:center;
      padding:20px;
      background:rgba(0,0,0,0.72);
      overflow-y:auto;
    }

    .admin-card{
      width:min(720px, 100%);
      max-height:92vh;
      overflow-y:auto;
      background:var(--card);
      color:var(--text);
      border-radius:24px;
      padding:24px;
      box-shadow:0 24px 60px rgba(0,0,0,0.4);
      border:1px solid var(--border);
      backdrop-filter: blur(18px);
    }

    .admin-card h2,
    .admin-card h3{
      margin-bottom:15px;
    }

    .admin-item{
      border:1px solid var(--border);
      border-radius:18px;
      padding:15px;
      margin-top:12px;
      background:rgba(255,255,255,0.08);
    }

    .admin-item p{
      white-space:pre-line;
      line-height:1.45;
      margin:8px 0;
    }

    footer{
      text-align:center;
      padding:22px;
      color:var(--muted);
      font-family: Arial, sans-serif;
      background:var(--bg-soft);
      border-top:1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    @media(max-width:720px){
      header{
        position:relative;
        flex-direction:column;
        align-items:flex-start;
      }

      .header-actions{
        width:100%;
        justify-content:flex-start;
      }

      .brand h1{
        font-size:26px;
      }

      .poem-text{
        font-size:19px;
      }

      .poem-card,
      .composer{
        border-radius:20px;
        padding:20px;
      }

      button{
        width:auto;
      }
    }
  </style>
</head>

<body>
<header>
  <div class="brand">
    <h1>Poesías by Andy</h1>
    <p>Fragmentos, pensamientos y versos cortos.</p>
  </div>

  <div class="header-actions">
    <button class="secondary" onclick="cambiarModo()" id="modoBtn">🌙 Oscuro</button>
    <button onclick="abrirAdmin()">⚙️ Administrar</button>
  </div>
</header>

<main>
  <section class="composer">
    <div class="composer-top">
      <div class="avatar">A</div>
      <span>Publicar nueva poesía</span>
    </div>

    <input id="tituloNuevo" type="text" placeholder="Título opcional">
    <textarea id="textoNuevo" placeholder="¿Qué poesía quieres publicar hoy?"></textarea>

    <div class="composer-actions">
      <span class="hint">Se guarda en este navegador usando memoria local.</span>
      <button onclick="publicarPoesia()">Publicar</button>
    </div>
  </section>

  <section class="feed" id="feedPoesias"></section>
</main>

<footer>
  © 2026 • Poesías by Andy
</footer>

<div class="admin-panel" id="adminPanel">
  <div class="admin-card">
    <h2>⚙️ Administración</h2>

    <div id="loginArea">
      <input type="password" id="claveAdmin" placeholder="Clave de administración">
      <button onclick="verificarClave()">Entrar</button>
      <button class="secondary" onclick="cerrarAdmin()">Cerrar</button>
    </div>

    <div id="adminArea" style="display:none;">
      <input id="tituloEditar" type="text" placeholder="Título opcional">
      <textarea id="textoEditar" placeholder="Texto de la poesía"></textarea>

      <button onclick="guardarEdicion()" id="btnGuardar" style="display:none;">Guardar cambios</button>
      <button class="secondary" onclick="cancelarEdicion()" id="btnCancelar" style="display:none;">Cancelar edición</button>

      <h3 style="margin-top:22px;">📚 Poesías publicadas</h3>
      <div id="listaAdmin"></div>

      <button class="secondary" onclick="cerrarAdmin()" style="margin-top:18px;">Cerrar</button>
    </div>
  </div>
</div>

<script>
const poesiasIniciales = [
  {
    titulo:"El milagro del tiempo",
    texto:"Caminé por los senderos del pasado y vi que la muchedumbre anhelaba un solo milagro para despertar el tiempo.\n\nAllí vi aquel único milagro: yo, en el tiempo pasado, siendo el milagro que ellos esperaban.",
    fecha:"Publicado el 12/6/2026"
  }
];

let poesias = cargarPoesias();
let indiceEditando = null;

function cargarPoesias(){
  try{
    const guardadas = JSON.parse(localStorage.getItem("poesiasByAndy"));
    if(Array.isArray(guardadas) && guardadas.length > 0){
      return guardadas.filter(p => p && typeof p.texto === "string");
    }
    return poesiasIniciales;
  }catch(error){
    localStorage.removeItem("poesiasByAndy");
    return poesiasIniciales;
  }
}

function guardarPoesias(){
  localStorage.setItem("poesiasByAndy", JSON.stringify(poesias));
}

function formatoFecha(prefix){
  const ahora = new Date();
  const fecha = ahora.toLocaleDateString("es-DO");
  const hora = ahora.toLocaleTimeString("es-DO", {hour:"2-digit", minute:"2-digit"});
  return prefix + " " + fecha + " a las " + hora;
}

function escapar(texto){
  const div = document.createElement("div");
  div.innerText = texto || "";
  return div.innerHTML;
}

function renderizarFeed(){
  const feed = document.getElementById("feedPoesias");
  feed.innerHTML = "";

  if(poesias.length === 0){
    feed.innerHTML = '<div class="poem-card"><div class="poem-text">Todavía no hay poesías publicadas.</div></div>';
    return;
  }

  poesias.forEach((poesia, index) => {
    const card = document.createElement("article");
    card.className = "poem-card";

    const titulo = poesia.titulo && poesia.titulo.trim() !== "" 
      ? '<div class="poem-title">' + escapar(poesia.titulo) + '</div>'
      : "";

    card.innerHTML = `
      ${titulo}
      <div class="poem-text">${escapar(poesia.texto)}</div>
      <div class="poem-date">${escapar(poesia.fecha || "Publicado")}</div>
      <div class="post-actions">
        <button class="secondary" onclick="copiarPoesia(${index})">Copiar</button>
      </div>
    `;

    feed.appendChild(card);
  });
}

function publicarPoesia(){
  const titulo = document.getElementById("tituloNuevo").value.trim();
  const texto = document.getElementById("textoNuevo").value.trim();

  if(texto === ""){
    alert("Escribe una poesía antes de publicar.");
    return;
  }

  poesias.unshift({
    titulo:titulo,
    texto:texto,
    fecha:formatoFecha("Publicado el")
  });

  guardarPoesias();
  document.getElementById("tituloNuevo").value = "";
  document.getElementById("textoNuevo").value = "";
  renderizarFeed();
  renderizarAdmin();
}

function copiarPoesia(index){
  const p = poesias[index];
  const contenido = (p.titulo ? p.titulo + "\n\n" : "") + p.texto;
  navigator.clipboard.writeText(contenido).then(() => {
    alert("Poesía copiada.");
  }).catch(() => {
    alert("No se pudo copiar automáticamente.");
  });
}

function abrirAdmin(){
  document.getElementById("adminPanel").style.display = "flex";
  renderizarAdmin();
}

function cerrarAdmin(){
  document.getElementById("adminPanel").style.display = "none";
}

function verificarClave(){
  const clave = document.getElementById("claveAdmin").value;

  if(clave === "3321"){
    document.getElementById("loginArea").style.display = "none";
    document.getElementById("adminArea").style.display = "block";
    renderizarAdmin();
  }else{
    alert("Clave incorrecta.");
  }
}

function renderizarAdmin(){
  const lista = document.getElementById("listaAdmin");
  if(!lista) return;

  lista.innerHTML = "";

  if(poesias.length === 0){
    lista.innerHTML = "<p>No hay poesías publicadas.</p>";
    return;
  }

  poesias.forEach((poesia, index) => {
    const item = document.createElement("div");
    item.className = "admin-item";
    item.innerHTML = `
      <strong>${escapar(poesia.titulo || "Sin título")}</strong>
      <p>${escapar(poesia.texto)}</p>
      <small>${escapar(poesia.fecha || "Publicado")}</small>
      <div class="post-actions">
        <button class="edit-btn" onclick="editarPoesia(${index})">Editar</button>
        <button class="delete-btn" onclick="eliminarPoesia(${index})">Eliminar</button>
      </div>
    `;
    lista.appendChild(item);
  });
}

function editarPoesia(index){
  indiceEditando = index;
  document.getElementById("tituloEditar").value = poesias[index].titulo || "";
  document.getElementById("textoEditar").value = poesias[index].texto || "";
  document.getElementById("btnGuardar").style.display = "inline-block";
  document.getElementById("btnCancelar").style.display = "inline-block";
  document.getElementById("textoEditar").focus();
}

function guardarEdicion(){
  if(indiceEditando === null) return;

  const titulo = document.getElementById("tituloEditar").value.trim();
  const texto = document.getElementById("textoEditar").value.trim();

  if(texto === ""){
    alert("El texto no puede quedar vacío.");
    return;
  }

  poesias[indiceEditando].titulo = titulo;
  poesias[indiceEditando].texto = texto;
  poesias[indiceEditando].fecha = formatoFecha("Editado el");

  guardarPoesias();
  cancelarEdicion();
  renderizarFeed();
  renderizarAdmin();
}

function cancelarEdicion(){
  indiceEditando = null;
  document.getElementById("tituloEditar").value = "";
  document.getElementById("textoEditar").value = "";
  document.getElementById("btnGuardar").style.display = "none";
  document.getElementById("btnCancelar").style.display = "none";
}

function eliminarPoesia(index){
  if(!confirm("¿Seguro que quieres eliminar esta poesía?")) return;
  poesias.splice(index, 1);
  guardarPoesias();
  renderizarFeed();
  renderizarAdmin();
}

function cambiarModo(){
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    localStorage.setItem("modoPoesias", "oscuro");
    document.getElementById("modoBtn").innerText = "☀️ Claro";
  }else{
    localStorage.setItem("modoPoesias", "claro");
    document.getElementById("modoBtn").innerText = "🌙 Oscuro";
  }
}

window.onload = function(){
  const modo = localStorage.getItem("modoPoesias");
  if(modo === "oscuro"){
    document.body.classList.add("dark");
    document.getElementById("modoBtn").innerText = "☀️ Claro";
  }
  renderizarFeed();
};
</script>
</body>
</html>
